# DSC (Database Schema Convertor) Teradata 配置
# 用于 features-teradata.properties

# 是否将 Teradata 的 SET 表转换为 DWS 的 SET 表
convertSETTable=true

# 是否将 Teradata 的 MULTISET 表转换为 DWS 的 MULTISET 表
convertMULTISETTable=true

# 是否转换 Teradata 宏 (MACRO) 为存储过程
convertMacroToProcedure=true

# 是否转换 Teradata 的 BTEQ 脚本
convertBTEQ=true

# 是否转换 Teradata 的 FASTEXPORT 脚本
convertFastExport=true

# 是否转换 Teradata 的 FASTLOAD 脚本
convertFastLoad=true

# 是否转换 Teradata 的 MULTILOAD 脚本
convertMultiLoad=true

# 是否转换 Teradata 的 TPUMP 脚本
convertTPUMP=true

# 是否保留注释
retainComments=true

# 是否添加 DISTRIBUTE BY 子句
addDistributeBy=true

# 默认分布策略: HASH, ROUNDROBIN, REPLICATION
defaultDistributeBy=ROUNDROBIN

# 是否转换 Teradata 的 QUALIFY 子句
convertQualify=true

# 是否转换 Teradata 的 NAMED 子句
convertNamed=true

# 是否转换 Teradata 的 WITH 子句
convertWith=true

# Teradata 模式: TD_MODE, ORA_MODE
teradataMode=TD_MODE
