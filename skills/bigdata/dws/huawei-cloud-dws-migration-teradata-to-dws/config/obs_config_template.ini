# OBS 连接配置模板
# 用于 migrate_data.py --method obs 模式
# 将此文件复制为 obs_config.ini 并填写实际值
# 安全要求：AK/SK 不写入文件。脚本会优先读取环境变量
#   OBS_ACCESS_KEY / OBS_SECRET_KEY；若环境变量缺失再读取本文件对应字段。

[obs]
# OBS 桶名
bucket = your-obs-bucket

# OBS 访问密钥 (AK)，建议通过环境变量 OBS_ACCESS_KEY 注入
# access_key =

# OBS 秘密密钥 (SK)，建议通过环境变量 OBS_SECRET_KEY 注入
# secret_key =

# OBS 终端节点 (根据桶所在区域选择)
# 华北-北京四: obs.cn-north-4.myhuaweicloud.com
# 华东-上海一: obs.cn-east-3.myhuaweicloud.com
# 华南-广州:   obs.cn-south-1.myhuaweicloud.com
endpoint = obs.cn-north-4.myhuaweicloud.com

# obsutil 命令路径 (如已加入 PATH 则用 obsutil)
obsutil_path = obsutil

# OBS 外表分片大小 (MB)，影响并行度，默认 64
chunksize = 64

# 并行导入度，建议不超过 DWS 节点数 × 2，默认 8
parallel = 8