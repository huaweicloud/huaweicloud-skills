# ==============================================================================
# 实例相关 API 配置
# 对应文档: 2.12 实例
# ==============================================================================

get_instances:
  # 2.12.11 查询实例
  # 查询指定服务的实例列表，返回的信息包括实例的运行状态信息，实例所在主机等信息
  # 权限: 集群查看，集群管理
  desc: "查询实例"
  method: "GET"
  path: "/api/v2/clusters/{cluster_id}/services/{service_name}/instances"
  required_params:
    - cluster_id
    - service_name
  optional_params:
    - hostname
    - role_name
  response_filter:
    instances:
      - id
      - name
      - runningStatus
      - haStatus
      - configStatus
      - roleName
      - serviceName
      - host: hostname

get_instance_detail:
  # 2.12.13 查询指定实例
  # 查询指定的实例，返回的信息包括实例的运行状态信息，实例所在主机等信息
  # 权限: 集群查看，集群管理
  desc: "查询指定实例"
  method: "GET"
  path: "/api/v2/clusters/{cluster_id}/services/{service_name}/instances/{instance_id}"
  required_params:
    - cluster_id
    - service_name
    - instance_id
  optional_params: []

