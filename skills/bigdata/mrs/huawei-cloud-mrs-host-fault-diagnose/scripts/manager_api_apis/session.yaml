# ==============================================================================
# 会话相关 API 配置
# 对应文档: 2.5 会话
# ==============================================================================

login_check:
  # 2.5.1 登录检查
  # 完成CAS认证后调用此接口，检查是否需要修改密码，并获得CSRF的token
  # 用于获取 JSESSIONID Cookie，支持后续 Cookie 认证模式
  # 权限: 登录成功即可访问
  desc: "登录检查（获取 JSESSIONID Cookie）"
  method: "POST"
  path: "/api/v2/login_check"
  timeout: 30
  required_params: []
  optional_params: []

get_session_status:
  # 2.5.4 查询当前会话状态
  # webUI使用该接口维护会话连接，同时查询系统时间和告警统计
  # 权限: 登录成功即可访问
  desc: "查询当前会话状态"
  method: "GET"
  path: "/api/v2/session/status"
  required_params: []
  optional_params: []

get_session_user:
  # 2.5.6 获取当前用户信息
  # 获取当前登录用户的权限，webUI根据这些权限来显示相应的界面
  # 权限: 登录成功即可访问
  desc: "获取当前用户信息"
  method: "GET"
  path: "/api/v2/session/user"
  required_params: []
  optional_params: []
