# MRS Manager REST API 调用配置文件
# 密码字段需加密后存储

# ==================== 常用配置 ====================

# MRS Manager 服务连接配置
server:
  # Manager 浮动 IP 地址
  # 获取方式（任选其一）：
  #   1. 在 OMS 节点执行: grep float_ip /opt/huawei/Bigdata/om-server/OMS/workspace/conf/oms.ini
  #   2. 在 OMS 节点执行: ip addr | grep <已知的OMS网段>，浮动IP在主OMS节点上
  #   3. 登录主OMS节点后访问 https://<本机IP>:28443/web，若能打开则为浮动IP
  #   4. 询问集群管理员获取
  host: "XXX.XXX.XXX.XXX"
  # Manager Web 端口（默认 28443）
  port: 28443
  scheme: "https"
  # 基础路径（Manager 接口均以 /web 开头）
  base_path: "/web"
  # HTTP 请求超时（秒）
  timeout: 60

# 认证配置（HTTP Basic Auth）
auth:
  username: "admin"
  # 密码需加密后填入，使用 --encrypt-password 命令加密
  encrypted_password: ""

# ==================== 其他配置 ====================

# Cookie 缓存配置（JSESSIONID）
session:
  # 缓存目录，为空则使用系统临时目录下 manager_session 子目录
  # Win: %TEMP%\manager_session, Linux: /tmp/manager_session
  cache_dir: ""
  # 有效期（秒），默认2小时（Manager Session 默认超时时间）
  ttl: 7200

# 加密组件配置
# Linux: 自动使用 CryptoAPI（生产环境，密钥由安全组件管理）
# Windows: 自动使用 AES-256-CBC（开发环境，密钥存本地 .aes_key 文件）
crypto:
  # ---------------- CryptoAPI 配置（Linux） ----------------
  bin_path: "/usr/local/seccomponent/bin/CryptoAPI"
  # SCC_CONF 路径，为空则从环境变量 SCC_CONF 读取
  scc_conf: ""
  # ----------------   AES 配置（Windows）   ----------------
  # 密钥文件路径，为空则默认使用脚本同目录下的 .aes_key（首次加密时自动生成）
  aes_key_file: ""
  # --- SSL 配置 ---
  # 是否跳过 SSL 证书验证，仅自签名证书的内网环境设为 true
  verify_ssl: false
  # 自定义 CA 证书路径，为空则使用系统默认证书
  ca_cert: ""

# ==================== API配置 ====================
# API 接口定义在 manager_api_apis/ 目录下的分类YAML文件中
# 每个文件对应一个功能模块，脚本启动时自动加载该目录下所有 .yaml/.yml 文件
#
# 目录结构:
#   manager_api_apis/
#   ├── session.yaml       # 会话 (2.5)
#   ├── cluster.yaml       # 集群 (2.31)
#   ├── host.yaml          # 主机 (2.4)
#   ├── alarm.yaml         # 告警 (2.8)
#   ├── audit.yaml         # 审计 (2.14)
#   ├── log.yaml           # 日志 (2.18)
#   ├── monitor.yaml       # 监控 (2.21)
#   ├── service.yaml       # 服务 (2.19)
#   ├── instance.yaml      # 实例 (2.12)
#   ├── stack.yaml         # 堆栈采集 (2.18)
#   ├── command.yaml       # 命令 (2.9)
#   ├── health_check.yaml  # 健康检查 (2.6)
#   ├── tool.yaml          # 工具 (2.15)
#   ├── report.yaml        # 报表 (2.17)
#   ├── system.yaml        # 系统/OMS (2.24)
#   └── permission.yaml    # 用户权限 (2.20)
#
# 每个API接口包含: desc, method, path, timeout, required_params, optional_params
# desc: 接口描述
# method: GET / POST / PUT / DELETE
# path: 接口路径（相对于 base_path），支持 {param} 占位符
# timeout: HTTP 请求超时（秒），不配置则使用 server.timeout
# required_params: 必填参数列表
# optional_params: 可选参数列表（GET 请求会作为 query 参数）
# param_rules: 参数校验规则（可选），未配置的参数不校验
#   type: str(默认) | int | enum | path
#   str 类型: pattern(正则), error(自定义报错)
#   int 类型: min, max
#   enum 类型: values(允许值列表)
#   path 类型: prefix(路径前缀限制)
# request_body: POST/PUT/DELETE 请求体字段映射（key: 参数名, value: 对应JSON字段名）
#   特殊值 "__raw__" 表示直接传入整个 JSON 字符串作为请求体
apis: {}
